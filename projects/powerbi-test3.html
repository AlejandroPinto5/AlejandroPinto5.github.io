    .nav-links{display:flex;align-items:center;gap:2.5rem;}.nav-link{font-size:0.82rem;color:var(--text-dim);letter-spacing:0.06em;transition:color var(--transition);display:flex;align-items:center;gap:0.4rem;}.nav-link:hover{color:var(--accent);}.link-num{color:var(--accent);font-size:0.75rem;}.nav-cv{border:1px solid var(--border-hi);padding:0.35rem 0.9rem;border-radius:var(--radius);color:var(--accent)!important;}.nav-cv:hover{background:rgba(0,200,255,0.1);}

    .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;}.hamburger span{display:block;width:22px;height:2px;background:var(--text);}
    .page-wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:90px 2rem 5rem;}
    .page-header{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border);}

    .embed-full{width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
    .embed-full iframe{width:100%;height:calc(100vh - 160px);min-height:600px;border:none;display:block;}
    .site-footer{position:relative;z-index:1;border-top:1px solid var(--border);background:var(--bg);padding:2rem 5rem;margin-top:2rem;}
    .footer-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
    .footer-brand{font-size:1rem;font-weight:700;color:var(--accent);margin-right:1rem;}.footer-copy{font-size:0.75rem;color:var(--text-dim);}.footer-right{display:flex;gap:1.2rem;}
    ::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:3px;}::-webkit-scrollbar-thumb:hover{background:var(--accent);}
    @media(max-width:768px){.navbar{padding:0 1.5rem;}.nav-links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--border);padding:1.5rem;gap:1.2rem;}.nav-links.open{display:flex;}.hamburger{display:flex;}.nav-socials{display:none;}.embed-full iframe{height:60vh;}.site-footer{padding:2rem 1.5rem;}}
